     GLOBAL DARK BACKGROUND
===================================================== -->

<style>

<!-- =====================================================
     NAVBAR KREASI VISUAL
===================================================== -->

<style>

    /* ================================
       NAVBAR
    ================================= */

    .main-navbar {
        position: sticky;
        top: 0;
        z-index: 1000;
        width: 100%;
        height: 70px;
        background: #121212;
        border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .navbar-container {
        max-width: 1280px;
        height: 100%;
        margin: 0 auto;
        padding: 0 32px;
    }

    .navbar-inner {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }


    /* ================================
       LOGO
    ================================= */

    .logo-link {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #F9F6F2;
        text-decoration: none;
    }

    .logo-icon {
        color: #E0C39A;
        font-size: 32px;
    }

    .logo-text {
        color: #F9F6F2;
        font-family: "Playfair Display", serif;
        font-size: 27px;
        font-weight: 700;
        white-space: nowrap;
    }


    /* ================================
       MENU DESKTOP
    ================================= */

    .desktop-menu {
        display: flex;
        align-items: center;
        gap: 40px;
    }

    .desktop-menu a {
        position: relative;
        display: flex;
        align-items: center;
        height: 70px;

        color: rgba(249,246,242,0.78);

        font-family: "Lato", sans-serif;
        font-size: 16px;
        font-weight: 500;

        text-decoration: none;

        transition: color 0.25s ease;
    }

    .desktop-menu a:hover {
        color: #E0C39A;
    }


    /* ================================
       MENU YANG SEDANG AKTIF
    ================================= */

    .desktop-menu a.active {
        color: #E0C39A;
        font-weight: 700;
    }

    .desktop-menu a.active::after {
        content: "";

        position: absolute;

        left: 0;
        right: 0;
        bottom: 15px;

        height: 2px;

        background: #E0C39A;
    }


    /* ================================
       TOMBOL MENU HP
       HANYA MUNCUL DI HP
    ================================= */

    #mobileMenuBtn {
        display: none;

        width: 44px;
        height: 44px;

        align-items: center;
        justify-content: center;

        border: none;
        outline: none;

        background: transparent;

        color: #F9F6F2;

        cursor: pointer;

        border-radius: 6px;
    }

    #mobileMenuBtn:hover {
        color: #E0C39A;
        background: rgba(224,195,154,0.08);
    }

    #mobileMenuBtn .material-symbols-outlined {
        font-size: 30px;
    }


    /* ================================
       MOBILE MENU
    ================================= */

    #mobileMenu {
        position: fixed;
        inset: 0;

        z-index: 9999;

        opacity: 0;
        visibility: hidden;
        pointer-events: none;

        transition:
            opacity 0.25s ease,
            visibility 0.25s ease;
    }

    #mobileMenu.show {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }


    /* ================================
       BACKDROP
    ================================= */

    #menuBackdrop {
        position: absolute;
        inset: 0;

        background: rgba(0,0,0,0.75);

        backdrop-filter: blur(3px);
    }


    /* ================================
       SIDEBAR MENU HP
    ================================= */

    #mobileSidebar {
        position: absolute;

        left: 0;
        top: 0;

        width: 280px;
        max-width: 85vw;

        height: 100vh;

        background: #121212;

        border-right: 1px solid rgba(255,255,255,0.08);

        box-shadow: 15px 0 40px rgba(0,0,0,0.5);

        transform: translateX(-100%);

        transition: transform 0.3s ease;
    }

    #mobileMenu.show #mobileSidebar {
        transform: translateX(0);
    }


    /* ================================
       HEADER MENU HP
    ================================= */

    .mobile-header {
        height: 70px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 20px;

        border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .mobile-logo {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .mobile-logo-icon {
        color: #E0C39A;
        font-size: 28px;
    }

    .mobile-logo-text {
        color: #F9F6F2;

        font-family: "Playfair Display", serif;

        font-size: 20px;
        font-weight: 700;
    }


    /* ================================
       TOMBOL X
    ================================= */

    #closeMenu {
        width: 42px;
        height: 42px;

        display: flex;
        align-items: center;
        justify-content: center;

        border: none;
        outline: none;

        background: transparent;

        color: #F9F6F2;

        cursor: pointer;

        border-radius: 6px;
    }

    #closeMenu:hover {
        color: #E0C39A;
        background: rgba(224,195,154,0.08);
    }


    /* ================================
       MENU HP
    ================================= */

    .mobile-navigation {
        display: flex;
        flex-direction: column;

        gap: 5px;

        padding: 20px 14px;
    }

    .mobile-link {
        display: flex;
        align-items: center;

        gap: 15px;

        min-height: 50px;

        padding: 12px 14px;

        color: rgba(249,246,242,0.82);

        font-family: "Lato", sans-serif;

        font-size: 15px;
        font-weight: 500;

        text-decoration: none;

        border-radius: 7px;

        transition:
            color 0.25s ease,
            background 0.25s ease;
    }

    .mobile-link:hover {
        color: #E0C39A;
        background: rgba(224,195,154,0.07);
    }


    /* ================================
       MENU HP AKTIF
    ================================= */

    .mobile-link.active {
        color: #E0C39A;

        background: rgba(224,195,154,0.08);

        font-weight: 700;
    }

    .mobile-link.active .material-symbols-outlined {
        color: #E0C39A;
    }


    /* ================================
       RESPONSIVE
    ================================= */

    @media (max-width: 767px) {

        .main-navbar {
            height: 68px;
        }

        .navbar-container {
            padding: 0 18px;
        }

        .navbar-inner {
            height: 68px;
        }

        /* Menu desktop hilang */

        .desktop-menu {
            display: none !important;
        }

        /* Tombol hamburger muncul */

        #mobileMenuBtn {
            display: flex !important;
        }

        .logo-icon {
            font-size: 29px;
        }

        .logo-text {
            font-size: 21px;
        }
    }


    /* ================================
       DESKTOP
    ================================= */

    @media (min-width: 768px) {

        .desktop-menu {
            display: flex;
        }

        #mobileMenuBtn {
            display: none !important;
        }

        #mobileMenu {
            display: none !important;
        }
    }

</style>

<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

document.addEventListener("DOMContentLoaded", function () {


    /* =========================================
       ELEMENT
    ========================================= */

    const mobileMenuBtn =
        document.getElementById("mobileMenuBtn");

    const mobileMenu =
        document.getElementById("mobileMenu");

    const closeMenu =
        document.getElementById("closeMenu");

    const menuBackdrop =
        document.getElementById("menuBackdrop");


    /* =========================================
       BUKA MENU HP
    ========================================= */

    function openMobileMenu() {

        if (!mobileMenu) return;

        mobileMenu.classList.add("show");

        mobileMenu.setAttribute(
            "aria-hidden",
            "false"
        );

        if (mobileMenuBtn) {

            mobileMenuBtn.setAttribute(
                "aria-expanded",
                "true"
            );

        }

        document.body.style.overflow = "hidden";
    }


    /* =========================================
       TUTUP MENU HP
    ========================================= */

    function closeMobileMenu() {

        if (!mobileMenu) return;

        mobileMenu.classList.remove("show");

        mobileMenu.setAttribute(
            "aria-hidden",
            "true"
        );

        if (mobileMenuBtn) {

            mobileMenuBtn.setAttribute(
                "aria-expanded",
                "false"
            );

        }

        document.body.style.overflow = "";
    }


    /* =========================================
       KLIK TOMBOL HAMBURGER
    ========================================= */

    if (mobileMenuBtn) {

        mobileMenuBtn.addEventListener(
            "click",
            openMobileMenu
        );

    }


    /* =========================================
       KLIK TOMBOL X
    ========================================= */

    if (closeMenu) {

        closeMenu.addEventListener(
            "click",
            closeMobileMenu
        );

    }


    /* =========================================
       KLIK BACKDROP
    ========================================= */

    if (menuBackdrop) {

        menuBackdrop.addEventListener(
            "click",
            closeMobileMenu
        );

    }


    /* =========================================
       MENENTUKAN HALAMAN SEKARANG
    ========================================= */

    let currentPage =
        window.location.pathname
        .split("/")
        .pop()
        .toLowerCase();


    /*
       Kalau website dibuka:
       
       /
       
       maka dianggap sebagai index.html
    */

    if (
        currentPage === "" ||
        currentPage === "/"
    ) {

        currentPage = "index.html";

    }


    /* =========================================
       ACTIVE DESKTOP
    ========================================= */

    const desktopLinks =
        document.querySelectorAll(
            ".desktop-menu a"
        );


    desktopLinks.forEach(function (link) {

        const href =
            link.getAttribute("href");


        if (!href) return;


        const linkPage =
            href
            .split("/")
            .pop()
            .split("?")[0]
            .split("#")[0]
            .toLowerCase();


        link.classList.remove("active");


        if (
            linkPage === currentPage
        ) {

            link.classList.add("active");

        }

    });


    /* =========================================
       ACTIVE MOBILE
    ========================================= */

    const mobileLinks =
        document.querySelectorAll(
            ".mobile-link"
        );


    mobileLinks.forEach(function (link) {

        const href =
            link.getAttribute("href");


        if (!href) return;


        const linkPage =
            href
            .split("/")
            .pop()
            .split("?")[0]
            .split("#")[0]
            .toLowerCase();


        link.classList.remove("active");


        if (
            linkPage === currentPage
        ) {

            link.classList.add("active");

        }


        /*
           Setelah memilih halaman,
           menu HP ditutup.
        */

        link.addEventListener(
            "click",
            closeMobileMenu
        );

    });


    /* =========================================
       TOMBOL ESC
    ========================================= */

    document.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Escape" &&
                mobileMenu &&
                mobileMenu.classList.contains("show")
            ) {

                closeMobileMenu();

            }

        }
    );


    /* =========================================
       KETIKA LAYAR DIPERBESAR
    ========================================= */

    window.addEventListener(
        "resize",
        function () {

            if (window.innerWidth >= 768) {

                closeMobileMenu();

            }

        }
    );

});

</script>

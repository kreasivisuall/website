    /* ========================================================= */
    /* ====================== DESKTOP MENU ===================== */
    /* ========================================================= */

    .desktop-menu {

    }


    .desktop-menu a {
        position: relative;

        color: rgba(249, 246, 242, 0.8);

    }


    /* MENU KONTAK AKTIF */

    .desktop-menu a.active {
        color: #E0C39A;

        font-weight: 700;
    }


    .desktop-menu a.active::after {
        content: "";

        position: absolute;

        left: 0;
        right: 0;

        bottom: -10px;

        height: 2px;

        background: #E0C39A;
    }


    /* ========================================================= */
    /* ====================== HAMBURGER ======================== */
    /* ========================================================= */

    #mobileMenuBtn {
        display: none;

        width: 44px;
        height: 44px;

        padding: 0;

        border: none;

        outline: none;

        background: transparent;

        color: #F9F6F2;

        cursor: pointer;

        align-items: center;

        justify-content: center;

        border-radius: 6px;

        transition:
            color 0.3s ease,
            background 0.3s ease;
    }

        background: rgba(224, 195, 154, 0.08);
    }

    /* ====================== MOBILE MENU ====================== */
    /* ========================================================= */

    #mobileMenu {

        z-index: 9999;

        visibility: hidden;

        opacity: 0;

        pointer-events: none;

    }


    #mobileMenu.show {
        visibility: visible;

        opacity: 1;

        pointer-events: auto;
    }

        position: absolute;

        transform: translateX(-100%);

        transition: transform 0.35s ease;

        overflow-y: auto;
    }


    #mobileMenu.show #mobileSidebar {
        transform: translateX(0);
    }

<script>

    document.addEventListener("DOMContentLoaded", function () {


        /* ================= ELEMENT ================= */

        const mobileMenuBtn =
            document.getElementById("mobileMenuBtn");

        const mobileMenu =
            document.getElementById("mobileMenu");

        const closeMenu =
            document.getElementById("closeMenu");

        const menuBackdrop =
            document.getElementById("menuBackdrop");

        const mobileLinks =
            document.querySelectorAll(".mobile-link");


        /* ================= OPEN ================= */

        function openMobileMenu() {

            mobileMenu.classList.add("show");

            mobileMenu.setAttribute(
                "aria-hidden",
                "false"
            );

            mobileMenuBtn.setAttribute(
                "aria-expanded",
                "true"
            );

            document.body.style.overflow = "hidden";

        }


        /* ================= CLOSE ================= */

        function closeMobileMenu() {

            mobileMenu.classList.remove("show");

            mobileMenu.setAttribute(
                "aria-hidden",
                "true"
            );

            mobileMenuBtn.setAttribute(
                "aria-expanded",
                "false"
            );

            document.body.style.overflow = "";

        }


        /* ================= HAMBURGER ================= */

        if (mobileMenuBtn) {

            mobileMenuBtn.addEventListener(
                "click",
                openMobileMenu
            );

        }


        /* ================= CLOSE BUTTON ================= */

        if (closeMenu) {

            closeMenu.addEventListener(
                "click",
                closeMobileMenu
            );

        }


        /* ================= BACKDROP ================= */

        if (menuBackdrop) {

            menuBackdrop.addEventListener(
                "click",
                closeMobileMenu
            );

        }


        /* ================= MOBILE LINKS ================= */

        mobileLinks.forEach(function (link) {

            link.addEventListener(
                "click",
                closeMobileMenu
            );

        });


        /* ================= ESC ================= */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Escape" &&
                    mobileMenu.classList.contains("show")
                ) {

                    closeMobileMenu();

                }

            }
        );


        /* ================= RESIZE ================= */

        window.addEventListener(
            "resize",
            function () {

                if (window.innerWidth >= 768) {

                    closeMobileMenu();

                }

            }
        );

    });

</script>

<style>
.gallery {
  position: relative;
  width: 100%;
  padding: 16px;
}

.gallery-item {
  position: absolute;
  width: calc((100% - 24px) / 3);
}

.gallery-item img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 0;
}

/* Tablet */
@media (max-width: 1024px) {
  .gallery-item {
    width: calc((100% - 12px) / 2);
  }
}

/* HP */
@media (max-width: 768px) {
  .gallery-item {
    width: 100%;
  }
}
</style>

<script>
function arrangeGallery() {
    const gallery = document.querySelector('.gallery');
    const items = document.querySelectorAll('.gallery-item');

    if (!gallery || items.length === 0) return;

    const galleryWidth = gallery.clientWidth;
    const gap = 12;

    let columns = 3;

    if (window.innerWidth <= 768) {
        columns = 1;
    } else if (window.innerWidth <= 1024) {
        columns = 2;
    }

    const columnWidth = (galleryWidth - (gap * (columns - 1))) / columns;

    let columnHeights = new Array(columns).fill(0);

    items.forEach((item, index) => {
        const column = index % columns;

        const x = column * (columnWidth + gap);
        const y = columnHeights[column];

        item.style.width = columnWidth + 'px';
        item.style.left = x + 'px';
        item.style.top = y + 'px';

        columnHeights[column] += item.offsetHeight + gap;
    });

    gallery.style.height = Math.max(...columnHeights) + 'px';
}

window.addEventListener('load', arrangeGallery);
window.addEventListener('resize', arrangeGallery);
</script>

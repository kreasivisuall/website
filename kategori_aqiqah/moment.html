<script>

document.addEventListener("DOMContentLoaded", function () {


    /* =========================================
       ELEMENT
    ========================================= */

    const mobileMenuBtn =
        document.getElementById("mobileMenuBtn");

    const mobileMenu =
        document.getElementById("mobileMenu");

    const closeMenu =
        document.getElementById("closeMenu");

    const menuBackdrop =
        document.getElementById("menuBackdrop");


    /* =========================================
       BUKA MENU HP
    ========================================= */

    function openMobileMenu() {

        if (!mobileMenu) return;

        mobileMenu.classList.add("show");

        mobileMenu.setAttribute(
            "aria-hidden",
            "false"
        );

        if (mobileMenuBtn) {

            mobileMenuBtn.setAttribute(
                "aria-expanded",
                "true"
            );

        }

        document.body.style.overflow = "hidden";
    }


    /* =========================================
       TUTUP MENU HP
    ========================================= */

    function closeMobileMenu() {

        if (!mobileMenu) return;

        mobileMenu.classList.remove("show");

        mobileMenu.setAttribute(
            "aria-hidden",
            "true"
        );

        if (mobileMenuBtn) {

            mobileMenuBtn.setAttribute(
                "aria-expanded",
                "false"
            );

        }

        document.body.style.overflow = "";
    }


    /* =========================================
       KLIK TOMBOL HAMBURGER
    ========================================= */

    if (mobileMenuBtn) {

        mobileMenuBtn.addEventListener(
            "click",
            openMobileMenu
        );

    }


    /* =========================================
       KLIK TOMBOL X
    ========================================= */

    if (closeMenu) {

        closeMenu.addEventListener(
            "click",
            closeMobileMenu
        );

    }


    /* =========================================
       KLIK BACKDROP
    ========================================= */

    if (menuBackdrop) {

        menuBackdrop.addEventListener(
            "click",
            closeMobileMenu
        );

    }


    /* =========================================
       MENENTUKAN HALAMAN SEKARANG
    ========================================= */

    let currentPage =
        window.location.pathname
        .split("/")
        .pop()
        .toLowerCase();


    /*
       Kalau website dibuka:
       
       /
       
       maka dianggap sebagai index.html
    */

    if (
        currentPage === "" ||
        currentPage === "/"
    ) {

        currentPage = "index.html";

    }


    /* =========================================
       ACTIVE DESKTOP
    ========================================= */

    const desktopLinks =
        document.querySelectorAll(
            ".desktop-menu a"
        );


    desktopLinks.forEach(function (link) {

        const href =
            link.getAttribute("href");


        if (!href) return;


        const linkPage =
            href
            .split("/")
            .pop()
            .split("?")[0]
            .split("#")[0]
            .toLowerCase();


        link.classList.remove("active");


        if (
            linkPage === currentPage
        ) {

            link.classList.add("active");

        }

    });


    /* =========================================
       ACTIVE MOBILE
    ========================================= */

    const mobileLinks =
        document.querySelectorAll(
            ".mobile-link"
        );


    mobileLinks.forEach(function (link) {

        const href =
            link.getAttribute("href");


        if (!href) return;


        const linkPage =
            href
            .split("/")
            .pop()
            .split("?")[0]
            .split("#")[0]
            .toLowerCase();


        link.classList.remove("active");


        if (
            linkPage === currentPage
        ) {

            link.classList.add("active");

        }


        /*
           Setelah memilih halaman,
           menu HP ditutup.
        */

        link.addEventListener(
            "click",
            closeMobileMenu
        );

    });


    /* =========================================
       TOMBOL ESC
    ========================================= */

    document.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Escape" &&
                mobileMenu &&
                mobileMenu.classList.contains("show")
            ) {

                closeMobileMenu();

            }

        }
    );


    /* =========================================
       KETIKA LAYAR DIPERBESAR
    ========================================= */

    window.addEventListener(
        "resize",
        function () {

            if (window.innerWidth >= 768) {

                closeMobileMenu();

            }

        }
    );

});

</script>

<style>
.gallery {
  position: relative;
  width: 100%;
  padding: 16px;
}

.gallery-item {
  position: absolute;
  width: calc((100% - 24px) / 3);
}

.gallery-item img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 0;
}

/* Tablet */
@media (max-width: 1024px) {
  .gallery-item {
    width: calc((100% - 12px) / 2);
  }
}

/* HP */
@media (max-width: 768px) {
  .gallery-item {
    width: 100%;
  }
}
</style>

<script>
function arrangeGallery() {
    const gallery = document.querySelector('.gallery');
    const items = document.querySelectorAll('.gallery-item');

    if (!gallery || items.length === 0) return;

    const galleryWidth = gallery.clientWidth;
    const gap = 12;

    let columns = 3;

    if (window.innerWidth <= 768) {
        columns = 1;
    } else if (window.innerWidth <= 1024) {
        columns = 2;
    }

    const columnWidth = (galleryWidth - (gap * (columns - 1))) / columns;

    let columnHeights = new Array(columns).fill(0);

    items.forEach((item, index) => {
        const column = index % columns;

        const x = column * (columnWidth + gap);
        const y = columnHeights[column];

        item.style.width = columnWidth + 'px';
        item.style.left = x + 'px';
        item.style.top = y + 'px';

        columnHeights[column] += item.offsetHeight + gap;
    });

    gallery.style.height = Math.max(...columnHeights) + 'px';
}

window.addEventListener('load', arrangeGallery);
window.addEventListener('resize', arrangeGallery);
</script>
